<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة — دبّرلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
body{margin:0;font-family:"IBM Plex Sans Arabic","Tahoma",Arial;background:#f4f8f6;color:#12201c}header{background:linear-gradient(150deg,#0fa568,#066b41);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:700}header button{border:0;border-radius:10px;padding:10px 16px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-weight:600}main{max-width:1100px;margin:auto;padding:18px}.box,.stat{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 26px -14px rgba(8,50,33,.22);border:1px solid #e7ede9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:26px;display:block;margin-top:8px;color:#066b41}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,.actions button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#eef6f1;color:#17402f;font-weight:600}.active,.primary{background:linear-gradient(150deg,#0fa568,#066b41);color:#fff}.row{padding:14px 0;border-bottom:1px solid #eef1ef}.row:last-child{border:0}.muted{color:#728398}.ok{background:#1cad63;color:white}.bad{background:#e05252;color:white}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dce7e1;border-radius:10px}.field textarea{min-height:100px}.actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.thumb{width:100px;height:70px;object-fit:cover;border-radius:8px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><b>📍 دبّرلي — لوحة الإدارة</b><button onclick="location.href='index.html'">فتح التطبيق</button></header>
<main id="app"></main>
<script>
const {createClient}=supabase;const client=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const app=document.getElementById("app");
let session=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function isAdmin(){const {data:{user}}=await client.auth.getUser();if(!user)return false;const r=await client.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();return !!r.data}
async function login(){app.innerHTML='<div class="box"><h2>🔐 دخول الإدارة</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><button class="primary" onclick="doLogin()">دخول</button><p class="muted">أنشئ حساب المدير من Supabase Authentication ثم أضف UUID إلى جدول admins.</p></div>'}
async function doLogin(){const r=await client.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error){alert(r.error.message);return}if(!await isAdmin()){await client.auth.signOut();alert("هذا الحساب ليس مديرًا.");return}dashboard()}
async function dashboard(){if(!await isAdmin()){login();return}const [p,a,c,r]=await Promise.all([client.from("services").select("*",{count:"exact",head:true}).eq("status","pending"),client.from("services").select("*",{count:"exact",head:true}).eq("status","approved"),client.from("category_requests").select("*",{count:"exact",head:true}).eq("status","pending"),client.from("ratings").select("*",{count:"exact",head:true})]);app.innerHTML=`<div class="stats"><div class="stat">طلبات المراجعة<b>${p.count||0}</b></div><div class="stat">الخدمات المنشورة<b>${a.count||0}</b></div><div class="stat">التخصصات المقترحة<b>${c.count||0}</b></div><div class="stat">التقييمات<b>${r.count||0}</b></div></div><div class="tabs"><button class="active" onclick="pending()">طلبات الخدمات</button><button onclick="cats()">التخصصات</button><button onclick="news()">الأخبار والعاجل</button><button onclick="published()">الخدمات المنشورة</button><button onclick="logout()">خروج</button></div><section id="panel" class="box"></section>`;pending()}
async function pending(){const {data}=await client.from("services").select("*").eq("status","pending").order("created_at",{ascending:false});panel.innerHTML="<h2>طلبات الخدمات</h2>"+((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="muted">${esc(x.specialty)} · ${esc(x.category)} · ${esc(x.phone)}</div>${x.image_url?`<img class="thumb" src="${esc(x.image_url)}">`:""}<div class="actions"><button class="ok" onclick="act('${x.id}','approved')">قبول ونشر</button><button class="bad" onclick="act('${x.id}','rejected')">رفض</button></div></div>`).join("")||'<p class="muted">لا توجد طلبات.</p>')}
async function cats(){const {data}=await client.from("category_requests").select("*").eq("status","pending").order("created_at",{ascending:false});panel.innerHTML="<h2>التخصصات المقترحة</h2>"+((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="actions"><button class="ok" onclick="catAct('${x.id}','approved')">اعتماد</button><button class="bad" onclick="catAct('${x.id}','rejected')">رفض</button></div></div>`).join("")||'<p class="muted">لا توجد اقتراحات.</p>')}
async function act(id,status){const r=await client.from("services").update({status}).eq("id",id);if(r.error)alert(r.error.message);dashboard()}
async function catAct(id,status){const r=await client.from("category_requests").update({status}).eq("id",id);if(r.error)alert(r.error.message);dashboard()}
async function published(){const {data}=await client.from("services").select("*").eq("status","approved").order("created_at",{ascending:false});panel.innerHTML="<h2>الخدمات المنشورة</h2>"+((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="muted">${esc(x.specialty)} · ${esc(x.category)} · ${esc(x.area||"")} · ⭐ ${esc(x.rating||"")}</div><div class="actions"><button onclick='editService(${JSON.stringify(x)})'>تعديل</button><button class="bad" onclick="del('${x.id}')">حذف</button></div></div>`).join("")||'<p class="muted">لا توجد خدمات منشورة.</p>')}
function editService(x){panel.innerHTML=`<h2>تعديل الخدمة</h2><div class="field"><label>الاسم</label><input id="en" value="${esc(x.name)}"></div><div class="field"><label>المجال</label><input id="ec" value="${esc(x.category)}"></div><div class="field"><label>التخصص</label><input id="es" value="${esc(x.specialty)}"></div><div class="field"><label>الهاتف</label><input id="ep" value="${esc(x.phone)}"></div><div class="field"><label>واتساب</label><input id="ew" value="${esc(x.whatsapp||"")}"></div><div class="field"><label>فيسبوك</label><input id="ef" value="${esc(x.facebook||"")}"></div><div class="field"><label>المنطقة</label><input id="ea" value="${esc(x.area||"")}"></div><div class="field"><label>الرابط</label><input id="el" value="${esc(x.link||"")}" placeholder="https://..."></div><div class="field"><label>التفاصيل</label><textarea id="ed">${esc(x.details||"")}</textarea></div><div class="actions"><button class="ok" onclick="saveEdit('${x.id}')">حفظ</button><button onclick="published()">إلغاء</button></div>`}
async function saveEdit(id){const r=await client.from("services").update({name:en.value,category:ec.value,specialty:es.value,phone:ep.value,whatsapp:ew.value,facebook:ef.value,area:ea.value,details:ed.value,link:el.value}).eq("id",id);if(r.error)alert(r.error.message);dashboard()}
async function del(id){if(!confirm("حذف هذه الخدمة؟"))return;const r=await client.from("services").delete().eq("id",id);if(r.error)alert(r.error.message);dashboard()}
async function news(){const {data}=await client.from("news").select("*").order("created_at",{ascending:false}).limit(1);panel.innerHTML=`<h2>الأخبار والعاجل</h2><div class="field"><textarea id="nt">${esc(data?.[0]?.text||"")}</textarea></div><button class="primary" onclick="saveNews()">حفظ الخبر</button>`}
async function saveNews(){await client.from("news").update({active:false}).eq("active",true);const r=await client.from("news").insert({text:nt.value,active:true});if(r.error)alert(r.error.message);else alert("تم الحفظ")}
async function logout(){await client.auth.signOut();login()}
client.auth.getSession().then(({data})=>{session=data.session;if(session)dashboard();else login()});
</script></body></html>
