<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دبّرلي — كل ما تحتاجه</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script><script src="config.js?v=20260912-39"></script><script src="category-details.js?v=20260912-40"></script><link rel="stylesheet" href="style.css?v=20260911-10">
<style>
#dabbarliNewsTicker{margin:12px 14px 0;min-height:48px;background:#fff;border:1px solid #e5eee9;border-radius:16px;box-shadow:0 6px 18px rgba(8,50,33,.10);display:flex;align-items:center;overflow:hidden;direction:rtl}
#dabbarliNewsTicker .news-label{flex:0 0 auto;background:#0b8f58;color:#fff;font-weight:800;padding:12px 16px;font-size:14px}
#dabbarliNewsTicker .news-track{flex:1;overflow:hidden;white-space:nowrap;padding:0 12px}
#dabbarliNewsTicker .news-text{display:inline-block;font-size:13px;font-weight:600;color:#344139;animation:dabberliNewsMove 18s linear infinite}
@keyframes dabberliNewsMove{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(max-width:700px){#dabbarliNewsTicker{margin:10px 12px 0;min-height:44px;border-radius:14px}#dabbarliNewsTicker .news-label{padding:10px 12px;font-size:12px}#dabbarliNewsTicker .news-text{font-size:12px}}
</style>
</head>
<body>
<header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div class="brand"><div class="logo">✓</div><div class="brand-text"><strong>دبّرلي</strong><small>كل ما تحتاجه ... دبّرلي</small></div></div></header>
<main><section class="hero"><div class="hero-copy-left">من الجزائر<br>لخدمات أفضل</div><div class="hero-copy-right"><h1>دبّرلي ... حياتك أسهل</h1><p>خدمات موثوقة، من ناس تثق فيهم.</p></div><div class="hero-search"><input id="heroSearch" placeholder="ماذا تبحث عن؟"><button id="heroSearchBtn">⌕</button></div></section><section id="dabbarliNewsTicker" aria-label="آخر الأخبار"><div class="news-label">📰 آخر الأخبار</div><div class="news-track"><div class="news-text" id="dabbarliNewsText">تابع آخر الأخبار والمستجدات على دبّرلي</div></div></section><section id="content"></section></main>
<nav class="bottom-nav"><button data-page="home" class="active">⌂<span>الرئيسية</span></button><button data-page="search">⌕<span>البحث</span></button><button data-page="add" class="add-btn">＋<span>أضف خدمتك</span></button><button data-page="news">▣<span>الأخبار</span></button><button data-page="contact">☎<span>اتصل بنا</span></button></nav>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><button class="close" id="closeBtn">×</button><div class="drawer-brand"><h2>دبّرلي</h2></div><nav class="drawer-nav"><button data-page="about">ⓘ معلومات عنا</button><button data-page="contact">☎ اتصل بنا</button><button id="shareBtn">↗ مشاركة التطبيق</button></nav></aside><div class="toast" id="toast"></div>
<script>
const content=document.getElementById('content'),drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay');let client=null,services=[];try{client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY)}catch(e){}
const fallback=[{id:'demo-1',name:'كهربائي منازل',category:'خدمات منزلية',specialty:'كهربائي منازل',rating:4.8,area:'الجزائر العاصمة',phone:'0550000001',whatsapp:'0550000001',img:'https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=900&q=85'}];
const catData=[['tool','خدمات منزلية','#1688a3'],['car','النقل والمركبات','#f4b400'],['home','العقارات','#7846d8'],['heart','الصحة','#e92f3a'],['leaf','الزراعة والحدائق','#20a84a'],['laptop','التكنولوجيا','#1268c9'],['book','الدروس والتعليم','#ef791c'],['flower','الجمال والعناية','#ef5d8a'],['shop','التجارة والمحلات','#c77b30'],['more','خدمات أخرى','#7440d6']];
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}
async function loadServices(){const publicDirectory=Array.isArray(window.__dabbarliPublicServices)?window.__dabbarliPublicServices.map(s=>({...s,status:'approved',img:s.image_url||s.img||fallback[0].img,rating:Number(s.rating||0)})):[];if(!client){services=publicDirectory.length?publicDirectory:fallback;window.__dabbarliServices=services;return}try{const {data,error}=await client.from('services').select('*').eq('status','approved').order('created_at',{ascending:false});const dbServices=error?[]:(data||[]).map(s=>({...s,img:s.image_url||fallback[0].img,rating:Number(s.rating||0)}));const merged=[...dbServices];const ids=new Set(merged.map(s=>String(s.id)));publicDirectory.forEach(s=>{if(!ids.has(String(s.id))){merged.push(s);ids.add(String(s.id))}});services=merged.length?merged:fallback;window.__dabbarliServices=services}catch(e){console.error('loadServices',e);services=publicDirectory.length?publicDirectory:fallback;window.__dabbarliServices=services}}
function card(s){return `<article class="service"><button class="fav" onclick="toggleFav(this)">♡</button><img class="service-img" style="object-fit:cover;object-position:center" src="${esc(s.image_url||s.img||fallback[0].img)}" alt="${esc(s.name||s.specialty)}"><div class="service-body"><h3>${esc(s.name||s.specialty||'خدمة')}</h3><div class="rating-row"><span>${Number(s.rating||0).toFixed(1)}</span><span class="star">★</span></div><button class="primary" style="width:100%;margin-top:8px" onclick="showDetail('${esc(s.id)}')">عرض المعلومات</button></div></article>`}
async function loadNewsTicker(){const target=document.getElementById('dabbarliNewsText');if(!target)return;try{if(!client){target.textContent='تابع آخر الأخبار والمستجدات على دبّرلي';return}const {data,error}=await client.from('news').select('*').order('created_at',{ascending:false}).limit(8);if(error||!data||!data.length){target.textContent='تابع آخر الأخبار والمستجدات على دبّرلي';return}const text=data.map(n=>String(n.title||n.text||n.content||'')).filter(Boolean).join('   •   ');target.textContent=text||'تابع آخر الأخبار والمستجدات على دبّرلي'}catch(e){target.textContent='تابع آخر الأخبار والمستجدات على دبّرلي'}}
async function home(){await loadServices();content.innerHTML=`<div class="home-wrap"><section class="section"><div class="section-head"><div class="section-title-wrap"><h2>وش تحتاج ؟</h2><p>اختر من بين مئات الخدمات المتوفرة</p></div><button class="see-all" onclick="showAllCategories()">‹ عرض الكل</button></div><div class="categories">${catData.map(c=>`<button class="cat" onclick="category('${esc(c[1])}')"><b>${c[1]}</b></button>`).join('')}</div></section><section class="section" style="margin-top:42px"><div class="section-head"><div class="section-title-wrap"><h2>↗ الخدمات الأكثر طلبًا</h2><p>اكتشف أكثر الخدمات طلبًا من المستخدمين</p></div><button class="see-all" onclick="showAllServices()">‹ عرض الكل</button></div><div class="services">${services.slice(0,4).map(card).join('')}</div></section></div>`;setActive('home');loadNewsTicker()}
function showAllCategories(){content.innerHTML=`<div class="page-card"><div class="section-head"><h2>كل التصنيفات</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><div class="categories">${catData.map(c=>`<button class="cat" onclick="category('${esc(c[1])}')"><b>${c[1]}</b></button>`).join('')}</div></div>`}
function showAllServices(){content.innerHTML=`<div class="page-card"><div class="section-head"><h2>الخدمات الأكثر طلبًا</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><div class="services">${services.map(card).join('')}</div></div>`}
function category(type){if(type==='النقل والمركبات'||type==='النقل والآليات'){if(typeof renderTransportDetails==='function'){renderTransportDetails();return}}const list=services.filter(s=>s.category===type||s.specialty===type||s.name===type);content.innerHTML=`<div class="page-card"><div class="section-head"><h2>${esc(type)}</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><div class="services">${list.length?list.map(card).join(''):'<div class="empty">لا توجد خدمات منشورة في هذا التصنيف بعد.</div>'}</div></div>`}
function showDetail(id){const s=services.find(x=>String(x.id)===String(id));if(!s)return;const phone=s.phone||'',wa=s.whatsapp||phone,fb=s.facebook||'';content.innerHTML=`<div class="page-card detail"><button class="see-all" onclick="home()">‹ رجوع</button><img class="detail-img" style="margin-top:16px;object-fit:cover;object-position:center" src="${esc(s.image_url||s.img||fallback[0].img)}"><h2>${esc(s.name||s.specialty)}</h2><div class="muted">${esc(s.category||'')} ${s.area?' · '+esc(s.area):''}</div><div class="rating-row"><span class="star">★</span><span>${Number(s.rating||0).toFixed(1)}</span></div><p>${esc(s.details||'')}</p><div class="actions">${phone?`<a class="call" href="tel:${esc(phone)}">📞 اتصال</a>`:''}${wa?`<a class="wa" href="https://wa.me/213${esc(String(wa).replace(/^0/,''))}" target="_blank">💬 واتساب</a>`:''}${fb?`<a class="fb" href="${esc(fb)}" target="_blank">🔵 فيسبوك</a>`:''}</div></div>`}
async function searchPage(q=''){await loadServices();content.innerHTML=`<div class="page-card"><div class="searchbox"><input id="searchInput" value="${esc(q)}" placeholder="اسم الخدمة أو التخصص أو المنطقة..."><button onclick="doSearch()">بحث</button></div><div id="results"></div></div>`;if(q)doSearch();setActive('search')}
function doSearch(){const q=(document.getElementById('searchInput')||document.getElementById('heroSearch')).value.trim().toLowerCase();const list=services.filter(s=>`${s.name||''} ${s.category||''} ${s.specialty||''} ${s.area||''}`.toLowerCase().includes(q));const box=document.getElementById('results');if(box)box.innerHTML=`<div class="section-head"><h2>نتائج البحث</h2></div><div class="services">${list.length?list.map(card).join(''):'<div class="empty">لم نجد الخدمة المطلوبة.</div>'}</div>`}
function add(){content.innerHTML=`<div class="page-card form"><div class="section-head"><h2>أضف خدمتك</h2></div><div class="notice">ستظهر الخدمة بعد مراجعتها واعتمادها من الإدارة.</div><form id="addForm"><div class="field"><label>الاسم *</label><input name="name" required></div><div class="field"><label>المجال الرئيسي *</label><select name="category" required>${catData.map(c=>`<option>${c[1]}</option>`).join('')}</select></div><div class="field"><label>التخصص *</label><input name="specialty" required></div><div class="field"><label>لم تجد تخصصك؟ اقترح تخصصًا جديدًا</label><input name="newType"></div><div class="field"><label>رقم الهاتف *</label><input name="phone" required inputmode="tel"></div><div class="field"><label>واتساب</label><input name="whatsapp"></div><div class="field"><label>رابط فيسبوك</label><input name="facebook"></div><div class="field"><label>المنطقة</label><input name="area"></div><div class="field"><label>صورة الخدمة</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"></div><div class="field"><label>رابط الصفحة / الموقع</label><input name="link" type="url" placeholder="https://..."></div><div class="field"><label>التفاصيل</label><textarea name="details"></textarea></div><button class="primary" style="width:100%">إرسال للمراجعة</button></form></div>`;document.getElementById('addForm').onsubmit=submitService;setActive('add')}
async function resizeServiceImage(file){let source=file;const isHeic=/image\/(heic|heif)/i.test(file.type)||/\.(heic|heif)$/i.test(file.name||'');if(isHeic){if(typeof heic2any!=='function')throw new Error('تعذر دعم صورة HEIC في هذا المتصفح');const converted=await heic2any({blob:file,toType:'image/jpeg',quality:0.9});source=Array.isArray(converted)?converted[0]:converted}return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(source);img.onload=()=>{try{const maxW=1000,maxH=667,scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('المتصفح لا يدعم معالجة الصور');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);const qualities=[0.82,0.72,0.62,0.52];const encode=i=>{if(i>=qualities.length){URL.revokeObjectURL(url);reject(new Error('الصورة بعد الضغط ما زالت كبيرة'));return}canvas.toBlob(blob=>{if(blob&&blob.size<=4.5*1024*1024){URL.revokeObjectURL(url);resolve(blob)}else encode(i+1)},'image/webp',qualities[i])};encode(0)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('تعذر قراءة الصورة'))};img.src=url})}
async function submitService(e){e.preventDefault();if(!client){toast('تعذر الاتصال بقاعدة البيانات');return}const f=new FormData(e.target),row={name:f.get('name'),category:f.get('category'),specialty:f.get('specialty'),phone:f.get('phone'),whatsapp:f.get('whatsapp'),facebook:f.get('facebook'),area:f.get('area'),details:f.get('details'),link:f.get('link'),status:'pending'};const file=f.get('image');if(file instanceof File&&file.size>0){if(!['image/jpeg','image/png','image/webp','image/heic','image/heif'].includes(file.type)&&!(/\.(heic|heif)$/i.test(file.name||''))){toast('الصورة يجب أن تكون JPG أو PNG أو WEBP أو HEIC');return}if(file.size>20*1024*1024){toast('حجم الصورة الأصلية يجب ألا يتجاوز 20 ميغابايت');return}let processed;try{processed=await resizeServiceImage(file)}catch(err){console.error('Image processing error',err);toast('تعذر تجهيز الصورة: '+(err.message||'خطأ غير معروف'));return}const path=`services/${crypto.randomUUID()}.webp`;const {error:upErr}=await client.storage.from('service-images').upload(path,processed,{contentType:'image/webp',upsert:false});if(upErr){console.error('Image upload error',upErr);toast('تعذر رفع الصورة: '+upErr.message);return}row.image_url=client.storage.from('service-images').getPublicUrl(path).data.publicUrl}const {error}=await client.from('services').insert(row);if(error){toast('تعذر إرسال الخدمة: '+error.message);return}toast('تم إرسال الخدمة للمراجعة بنجاح');e.target.reset()}
function setActive(page){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}function toggleFav(b){b.classList.toggle('active');b.textContent=b.classList.contains('active')?'♥':'♡'}function showPage(page){if(page==='home')home();else if(page==='search')searchPage();else if(page==='add')add();else if(page==='news')newsPage();else if(page==='contact')contactPage();else if(page==='about')aboutPage()}function newsPage(){content.innerHTML='<div class="page-card"><div class="section-head"><h2>الأخبار</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><div class="empty">لا توجد أخبار منشورة حاليًا.</div></div>';setActive('news')}function contactPage(){content.innerHTML='<div class="page-card"><div class="section-head"><h2>اتصل بنا</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><p>للاستفسارات والاقتراحات، تواصل معنا.</p></div>';setActive('contact')}function aboutPage(){content.innerHTML='<div class="page-card"><div class="section-head"><h2>معلومات عنا</h2><button class="see-all" onclick="home()">‹ الرئيسية</button></div><p>دبّرلي دليل محلي للخدمات في الجزائر.</p></div>'}
document.querySelectorAll('.bottom-nav button,.drawer-nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{showPage(b.dataset.page);drawer.classList.remove('open');overlay.classList.remove('show')}));document.getElementById('menuBtn').onclick=()=>{drawer.classList.add('open');overlay.classList.add('show')};document.getElementById('closeBtn').onclick=()=>{drawer.classList.remove('open');overlay.classList.remove('show')};overlay.onclick=()=>{drawer.classList.remove('open');overlay.classList.remove('show')};document.getElementById('shareBtn').onclick=async()=>{try{await navigator.share({title:'دبّرلي',text:'دبّرلي ... حياتك أسهل',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);toast('تم نسخ رابط التطبيق')}catch(e2){}}};document.getElementById('heroSearchBtn').onclick=()=>searchPage(document.getElementById('heroSearch').value);document.getElementById('heroSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPage(e.target.value)});home();
</script>
</body>
</html>
