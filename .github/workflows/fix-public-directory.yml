name: Fix public directory integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public directory loading
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('category-details.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('dataset.generic-specialty', 'dataset.genericSpecialty')
          if 'window.__dabbarliPublicServices=publicServices' not in s:
              s = s.replace('const publicServices=[', 'const publicServices=[', 1)
              marker = '];'
              pos = s.find(marker, s.find('const publicServices=['))
              if pos != -1:
                  pos += len(marker)
                  s = s[:pos] + '\nwindow.__dabbarliPublicServices=publicServices;' + s[pos:]
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "services=error||!data?.length?fallback:data.map(s=>({...s,img:s.image_url||fallback[0].img,rating:Number(s.rating||0)}))"
          new = "const dbServices=error?[]:(data||[]).map(s=>({...s,img:s.image_url||fallback[0].img,rating:Number(s.rating||0)}));const publicDirectory=Array.isArray(window.__dabbarliPublicServices)?window.__dabbarliPublicServices.map(s=>({...s,status:'approved',img:s.image_url||s.img||fallback[0].img,rating:Number(s.rating||0)})):[];services=dbServices.length?[...dbServices,...publicDirectory]:(publicDirectory.length?publicDirectory:fallback)"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('category-details.js?v=20260911-29', 'category-details.js?v=20260912-33')
          s = s.replace('config.js?v=20260911-29', 'config.js?v=20260912-33')
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add category-details.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix public directory services loading'
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-public-directory.yml
          git commit -m 'Remove temporary public directory fixer'
          git push
