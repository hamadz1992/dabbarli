<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#d8f1e5"/><stop offset=".48" stop-color="#f8fcfa"/><stop offset="1" stop-color="#d9f0e5"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8fc9af" stop-opacity=".25"/>
  <stop offset="1" stop-color="#5aa887" stop-opacity=".48"/>
 </linearGradient>
</defs>
<rect width="1600" height="360" fill="url(#bg)"/>

<!-- soft decorative shapes -->
<ellipse cx="150" cy="-45" rx="285" ry="220" fill="#fff" opacity=".34"/>
<ellipse cx="1430" cy="370" rx="310" ry="190" fill="#78bda0" opacity=".09"/>
<circle cx="185" cy="90" r="60" fill="#fff" opacity=".28"/>

<!-- distant Algerian hills -->
<path d="M0 285 Q180 210 350 270 T680 275 T1010 265 T1320 250 T1600 265 V360 H0Z" fill="#a8d8c4" opacity=".75"/>
<path d="M0 310 Q210 265 410 300 T800 310 T1180 285 T1600 295 V360 H0Z" fill="#7dbda2" opacity=".35"/>

<!-- Martyrs' Memorial, complete and modest in scale -->
<g transform="translate(105 52)">
 <path d="M82 0 L98 0 L106 72 L128 238 L52 238 L74 72 Z" fill="#58a889" opacity=".78"/>
 <path d="M86 15 L94 15 L97 130 L90 190 L83 130 Z" fill="#e1f3e9" opacity=".95"/>
 <path d="M73 72 L82 238 L58 238 L48 170 Z" fill="#4e9d7e" opacity=".45"/>
 <path d="M105 72 L98 238 L122 238 L132 170 Z" fill="#4e9d7e" opacity=".45"/>
 <rect x="88" y="-15" width="5" height="18" rx="2" fill="#58a889"/>
</g>

<!-- palms -->
<g fill="#4f9b7b" opacity=".68">
 <g transform="translate(18 205)">
  <rect x="24" y="25" width="6" height="130" rx="3"/>
  <path d="M27 34 C0 18 -10 28 -24 14 C0 14 15 21 28 29 C17 2 22 -7 27 -18 C34 5 34 19 31 31 C49 8 63 10 76 6 C66 27 49 38 31 39 Z"/>
 </g>
 <g transform="translate(290 230) scale(.72)">
  <rect x="24" y="25" width="6" height="125" rx="3"/>
  <path d="M27 34 C0 18 -10 28 -24 14 C0 14 15 21 28 29 C17 2 22 -7 27 -18 C34 5 34 19 31 31 C49 8 63 10 76 6 C66 27 49 38 31 39 Z"/>
 </g>
</g>

<!-- understated skyline -->
<path d="M0 325 L45 312 70 325 92 300 110 325 137 307 156 325 183 314 202 325
230 296 252 325 275 311 300 325 326 304 350 325 377 310 402 325 430 303 454 325
486 312 512 325 542 302 568 325 600 309 628 325 655 300 684 325 710 312 742 325
V360 H0Z" fill="url(#ground)"/>

<!-- distant tower -->
<g transform="translate(370 205)" fill="#579e7f" opacity=".45">
 <rect x="4" y="35" width="5" height="105"/>
 <path d="M6 0 L14 35 L-2 35 Z"/>
 <rect x="-5" y="14" width="24" height="3" rx="1"/>
</g>

<!-- birds -->
<g fill="none" stroke="#4d9979" stroke-width="3.5" stroke-linecap="round" opacity=".58">
 <path d="M260 90 q9 -8 18 0 q9 -8 18 0"/>
 <path d="M315 116 q8 -7 16 0 q8 -7 16 0"/>
 <path d="M365 82 q8 -7 16 0 q8 -7 16 0"/>
</g>

<!-- very subtle right foliage -->
<g fill="#62aa8a" opacity=".16" transform="translate(1510 205)">
 <path d="M30 155 Q36 60 55 0 Q68 76 48 155Z"/>
 <ellipse cx="20" cy="65" rx="15" ry="44" transform="rotate(-32 20 65)"/>
 <ellipse cx="65" cy="93" rx="15" ry="48" transform="rotate(30 65 93)"/>
</g>
</svg>